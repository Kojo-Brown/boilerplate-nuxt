name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every gate runs once per Node major listed in `engines.node`, and warnings are
# treated as failures rather than log noise:
#   - `pnpm install --strict-peer-dependencies` turns an unmet peer range from a
#     warning into a non-zero exit.
#   - `.npmrc` sets `engine-strict=true`, so a runner outside `engines.node`
#     fails the install instead of silently building on an unsupported runtime.
#   - `pnpm lint` passes `--max-warnings=0`, so a rule configured to "warn" fails
#     the job instead of scrolling past.
#   - `NODE_OPTIONS: --throw-deprecation` promotes Node runtime deprecation
#     warnings to thrown errors, so a deprecated API — ours or a dependency's —
#     surfaces on the oldest and the newest supported runtime rather than at the
#     point where that API is finally removed.
# `--pending-deprecation` is deliberately not set: it flags APIs that are not
# deprecated yet, which would fail the build on advisory notices.
#
# `NODE_OPTIONS` is scoped to individual `run` steps rather than set on the
# workflow, because the marketplace actions below emit their own deprecation
# warnings (upload-artifact still pulls in `punycode`) and failing on those
# would report a runner problem as a repo problem.
#
# Every action is pinned to a major whose `action.yml` declares `using: node24`.
# The older `@v4` line targets node20, which the runner force-upgrades while
# emitting a deprecation warning on every job — a standing warning that this
# workflow is supposed to be free of.

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Lint
        run: pnpm lint
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Format check
        run: pnpm format:check
        env:
          NODE_OPTIONS: --throw-deprecation

  typecheck:
    name: Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --throw-deprecation

  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Run unit tests
        run: pnpm test
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  a11y:
    name: WCAG 2.2 AA (axe)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    # No Node matrix. The other gates run on both supported majors because they
    # are about this project's code under a runtime; this one measures the markup
    # and the computed styles a browser produces, which the Node version that
    # built them does not change. A second leg would double a four-minute job to
    # re-measure the same document.
    timeout-minutes: 20
    env:
      # The built server refuses to boot without one — that is what
      # `server/plugins/session-hardening.ts` is for. A throwaway value for a
      # throwaway server: it signs cookies for one audit run and is never a
      # deployment's key, so it is written here rather than taken from the secret
      # store, where a reader would have to wonder which it was.
      NUXT_SESSION_PASSWORD: a11y-audit-only-session-password-not-a-secret
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
        env:
          NODE_OPTIONS: --throw-deprecation

      # `--with-deps chromium`, not the whole browser set: the audit runs one
      # engine. axe's rules are about the document and the computed style, and the
      # places engines differ (which directive name a CSP violation reports, say)
      # are not what it measures.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm test:a11y` is `nuxt build && playwright test`, and the build is the
      # slow half. Splitting it out means a build failure reports itself as one
      # instead of as a Playwright `webServer` timeout.
      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Audit
        run: pnpm exec playwright test --config=playwright.a11y.config.ts
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nuxt_ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --throw-deprecation

      # Runs in this job rather than its own because it measures `.output/`,
      # which only exists here: a separate job would have to download the build
      # artifact and would then be reporting on an upload rather than on what
      # the build wrote. See docs/bundle-budget.md.
      - name: Bundle budget
        run: pnpm bundle:budget
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Upload bundle budget report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bundle-budget-node-${{ matrix.node-version }}
          path: .bundle-budget/report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: build-output-node-${{ matrix.node-version }}
          path: .output/
          retention-days: 1
